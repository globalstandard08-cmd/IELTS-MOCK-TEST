<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Test - Your Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            background-color: #f4f6f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1f3a5f;
            text-align: center;
            margin-bottom: 20px;
        }
        .summary {
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #1f3a5f;
            color: white;
        }
        .correct {
            color: #10b981;
            font-weight: bold;
        }
        .incorrect {
            color: #dc2626;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1f3a5f;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #2e568c;
        }
        .btn.clear {
            background-color: #dc2626;
        }
        .btn.clear:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 IELTS Listening Test – Your Results</h1>

        <div class="summary" id="summary"></div>

        <table id="resultsTable">
            <tr>
                <th>Question</th>
                <th>Your Answer</th>
                <th>Correct Answer</th>
                <th>Result</th>
            </tr>
        </table>

        <div style="margin-top: 20px;">
            <a href="index.html" class="btn">← Back to Main Menu</a>
            <button class="btn clear" onclick="startNewTest()">🗑️ Start New Test</button>
        </div>
    </div>

    <script>
        // OFFICIAL ANSWER KEY — update this with your actual answers
        const answerKey = {
            1: "PHOTO",
            2: "35",
            3: "PAYMENT",
            4: "HOLIDAY",
            5: "COLOUR",
            6: "HAND",
            7: "SIZE",
            8: "FOCUS",
            9: "WEEK",
            10: "ENVELOPE"
            // Add answers for 11–40 here when ready
        };

        function calculateBand(correct) {
            if (correct >= 39) return "9.0";
            if (correct >= 37) return "8.5";
            if (correct >= 35) return "8.0";
            if (correct >= 32) return "7.5";
            if (correct >= 30) return "7.0";
            if (correct >= 26) return "6.5";
            if (correct >= 23) return "6.0";
            if (correct >= 19) return "5.5";
            if (correct >= 16) return "5.0";
            if (correct >= 12) return "4.5";
            if (correct >= 9) return "4.0";
            return "Below 4.0";
        }

        function startNewTest() {
            if(confirm('⚠️ This will clear ALL your answers, notes, and reset the timer to 30:00.\n\nAre you sure you want to start a new test?')){
                localStorage.clear();
                localStorage.setItem('listeningTestStarted', 'true');
                localStorage.setItem('listeningTimeLeft', 30 * 60);
                window.location.href = 'listening-part1.html';
            }
        }

        window.addEventListener('load', function() {
            let totalCorrect = 0;
            const table = document.getElementById('resultsTable');

            for (let q = 1; q <= 40; q++) {
                const userAnswer = (localStorage.getItem(`listening_q${q}`) || "").trim().toUpperCase();
                const correctAnswer = (answerKey[q] || "").trim().toUpperCase();
                const isCorrect = userAnswer === correctAnswer;

                if (isCorrect) totalCorrect++;

                const row = table.insertRow();
                row.insertCell(0).textContent = q;
                row.insertCell(1).textContent = userAnswer || "(not answered)";
                row.insertCell(2).textContent = answerKey[q] || "(not available)";
                const resCell = row.insertCell(3);
                resCell.innerHTML = isCorrect ? '<span class="correct">✔ CORRECT</span>' : '<span class="incorrect">✘ INCORRECT</span>';
            }

            const band = calculateBand(totalCorrect);
            document.getElementById('summary').innerHTML =
                `<strong>Total Correct: ${totalCorrect} / 40</strong> &nbsp;|&nbsp; Estimated Band: <strong>${band}</strong>`;
        });
    </script>
</body>
</html>
